<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Yadu — AI, machine learning, and the interfaces around them.</title>
  <desc id="desc">A dark navy banner with mint and lavender accents, and a connected diagram labelled data, models, and interfaces.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1729"/><stop offset="1" stop-color="#142b36"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#86efce"/><stop offset="1" stop-color="#b8a6ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b8d9df" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <path d="M48 46H1152" stroke="#8eabc0" stroke-opacity=".22"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="52" y="82" fill="#86efce" font-size="14" font-weight="600" letter-spacing="3">YADU080 / PROJECTS &amp; EXPERIMENTS</text>
    <text x="48" y="174" fill="#f2f7fc" font-size="84" font-weight="700" letter-spacing="-4">Hey, I'm Yadu.</text>
    <text x="52" y="224" fill="#c0d0df" font-size="25">AI, machine learning,</text>
    <text x="52" y="259" fill="#c0d0df" font-size="25">and the interfaces around them.</text>
    <path d="M52 300H316" stroke="url(#line)" stroke-width="3"/>
    <text x="52" y="330" fill="#8fa7ba" font-size="13" letter-spacing="2">EXPLORE THE CODE. FOLLOW THE IDEAS.</text>
    <g fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".7">
      <path d="M865 126L1045 180L860 267Z"/>
      <circle cx="953" cy="195" r="113" stroke-opacity=".18"/>
      <circle cx="953" cy="195" r="145" stroke-opacity=".1"/>
    </g>
    <g fill="#111f31" stroke="#5e817d"><rect x="780" y="102" width="138" height="48" rx="24"/><rect x="969" y="156" width="150" height="48" rx="24"/><rect x="774" y="243" width="174" height="48" rx="24"/></g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" text-anchor="middle">
      <text x="849" y="132" fill="#86efce">data</text><text x="1044" y="186" fill="#c4b5fd">models</text><text x="861" y="273" fill="#c7dce9">interfaces</text>
    </g>
    <circle cx="952" cy="198" r="5" fill="#86efce"/>
    <circle cx="952" cy="198" r="13" fill="none" stroke="#86efce" stroke-opacity=".3"/>
  </g>
</svg>
