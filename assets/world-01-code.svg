<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title"><title id="title">World 01: AI Codebase Analyzer. Source files feed retrieval and a code-question interface.</title><style>
      .blink{animation:blink 2.4s steps(2,end) infinite}
      .float{animation:float 5s ease-in-out infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .dash{stroke-dasharray:5 9;animation:dash 8s linear infinite}
      .scan{animation:scan 7s ease-in-out infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}
      @keyframes blink{0%,70%,100%{opacity:1}71%,90%{opacity:.2}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-140}}
      @keyframes scan{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(125px);opacity:.65}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style><rect x="0" y="0" width="600" height="310" rx="12" fill="#0a1016" /><rect x="1" y="1" width="598" height="308" rx="12" fill="none" stroke="#2b3942"/><rect x="0" y="0" width="600" height="4" rx="0" fill="#c8ff64" /><text x="25" y="32" fill="#c8ff64" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2">WORLD 01</text><text x="575" y="32" fill="#80939f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="500" text-anchor="end">RETRIEVAL / EXPLORATION</text><text x="25" y="76" fill="#eff6f8" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" letter-spacing="-.7">AI Codebase Analyzer</text><path d="M25 99L575 99" stroke="#24333c" stroke-width="1" fill="none" /><text x="25" y="285" fill="#c8ff64" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2">ENTER WORLD</text><text x="574" y="286" fill="#c8ff64" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" text-anchor="end">↗</text><rect x="30" y="125" width="111" height="24" rx="4" fill="#18252a" stroke="#394f4c"/><text x="39" y="141" fill="#b2c5c4" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="400" >api.py</text><path d="M141 137L245 174" stroke="#547647" stroke-width="1.5" fill="none" class="dash"/><rect x="30" y="161" width="137" height="24" rx="4" fill="#18252a" stroke="#394f4c"/><text x="39" y="177" fill="#b2c5c4" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="400" >retriever.py</text><path d="M167 173L245 174" stroke="#547647" stroke-width="1.5" fill="none" class="dash"/><rect x="30" y="197" width="126" height="24" rx="4" fill="#18252a" stroke="#394f4c"/><text x="39" y="213" fill="#b2c5c4" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="400" >qa_engine.py</text><path d="M156 209L245 174" stroke="#547647" stroke-width="1.5" fill="none" class="dash"/><path d="M245 174L286 132L328 174L286 216Z" fill="#1b3021" stroke="#c8ff64" stroke-width="1.5"/><text x="286" y="179" fill="#c8ff64" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="600" text-anchor="middle">RAG</text><path d="M328 174L377 174" stroke="#c8ff64" stroke-width="1.5" fill="none" class="dash"/><rect x="378" y="125" width="192" height="101" rx="7" fill="#0f211b" stroke="#50794a"/><text x="392" y="147" fill="#c8ff64" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" >&gt; ASK THE CODE</text><rect x="393" y="164" width="140" height="4" rx="2" fill="#547961" /><rect x="393" y="177" width="118" height="4" rx="2" fill="#547961" /><rect x="393" y="190" width="151" height="4" rx="2" fill="#547961" /><rect x="393" y="203" width="81" height="4" rx="2" fill="#547961" /><rect x="480" y="203" width="7" height="9" rx="0" fill="#c8ff64" class="blink"/></svg>